numeric: {profile: legacy_mixed}
profile: paper_fair
df:
  mode: paper_r2
# Paper VII-A dynamics profile; RRT* search settings retained, not a FLASK reproduction.
system: unicycle
environment: wall
dynobench:
  model_file: ../../../models/paper/unicycle1_v2.yaml
  # Relative to this YAML. tools/run_six.py writes an absolute source path.
  source: ../../../../../dynobench-main/dynobench-main
  environment_file: unicycle1_v2/wall_0.yaml
lifting:
  start: {signed_velocity: 0.30}
  goal: {signed_velocity: 0.30}
sampling:
  guidance_probability: 0
planar_search:
  turn_limited_sampling: true
  turn_safety_factor: 0.7
  duration_factors: [0.9, 1.0, 1.1]
  terminal_speed: 0.30
planner:
  timeout: 30.0
  goal_bias: 0.15
  range: 0.5
  rewire_factor: 3.0
  goal_tolerance: 0.000001
  max_iterations: 100000
  max_nodes: 20000
  prune: false
  stop_at_first_solution: false
  rewire_before_first_solution: false
  explicit_goal_connection: true
  goal_parent_limit: 16
  cache_goal_connections: true
  model_time_hints: true
  minimum_parent_candidates: 8
  terminal_velocity_hint: true
pff:
  R_diagonal: [1, 1]
  free_terminal_state: true
  free_terminal_time: true
  min_time: 0.1
  max_time: 8.0
  fixed_time: 2.0
  additional_time_samples: 12
  defer_trajectories: true
simd:
  pff: true
  nearest_neighbor: true
geometry:
  robot_radius: 0.125
  obstacle_sphere_cell: 0.1
  collision_margin: 0.00001
validation:
  max_step: 0.005
  max_samples: 20000
  endpoint_tolerance: 0.001
benchmark:
  runs: 1
  seed: 40
  output_directory: ../../../../results/legacy_uni_wall
